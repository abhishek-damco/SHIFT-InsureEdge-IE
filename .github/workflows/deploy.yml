name: InsureEdge CI
 
on:

  workflow_dispatch:
 
permissions:

  contents: read
 
jobs:

  build:

    runs-on: self-hosted

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4
 
      - name: Set up Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

          cache: npm

          cache-dependency-path: Frontend/package-lock.json
 
      - name: Install frontend dependencies

        working-directory: Frontend

        run: npm ci
 
      - name: Build frontend

        working-directory: Frontend

        run: npm run build
 
      - name: Set up .NET

        uses: actions/setup-dotnet@v4

        with:

          dotnet-version: 8.0.x
 
      - name: Restore backend

        run: dotnet restore Backend/InsureEdge.sln
 
      - name: Publish API

        run: dotnet publish Backend/src/InsureEdge.API/InsureEdge.API.csproj --configuration Release --output "${{ runner.temp }}/InsureEdge-api"

 
