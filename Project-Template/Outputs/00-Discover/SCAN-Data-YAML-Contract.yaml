# ============================================================
# SECTION 5: RISKS (RSK-)
# ============================================================

risks:

  - id: INSUREEDGE-2026-RSK-1-0001
    severity: HIGH
    probability: HIGH
    evidence: [EV-0-0224]
    title: No database-level referential integrity on most relationships in DEV
    description: >
      InsureEdge_DEV declares FK constraints via ALTER TABLE but not on all logical
      relationships. Key missing database-level FKs include: Claim.PolicyId,
      Claim.AdjusterId, Worksheet.ClaimId, PolicyLimitCoverage (admitted via ALTER).
      Application-layer integrity is the only guarantee. Orphan records may exist.
    mitigation: Run orphan analysis SQL against all logical FK pairs before migration.
      Target schema must enforce referential integrity.

  - id: INSUREEDGE-2026-RSK-1-0002
    severity: HIGH
    probability: MEDIUM
    evidence: [EV-0-0224]
    title: Cross-database coupling — both DBs must migrate together
    description: >
      InsureEdge_DEV views and queries cross-join to InsureEdge_System_DEV using a
      runtime-resolved database name (IEDBName site property). The two databases are
      tightly coupled and cannot be migrated independently without breaking functionality.
    mitigation: Define a unified migration boundary that treats both databases as a
      single logical schema. In the target, evaluate merging into one database with
      schema separation (dbo.operational / dbo.system).

  - id: INSUREEDGE-2026-RSK-1-0003
    severity: HIGH
    probability: MEDIUM
    evidence: [EV-0-0224]
    title: Inline binary storage in database (varbinary(max)) creates migration volume risk
    description: >
      ClaimDocument.DocumentFile, TemplateDocument.DocumentFile, Note.Notes,
      Email.Message, BulkUploadAudit.ExcelFile, and IntermediaryProducerLogo.Logo
      store binary content inline in SQL Server. Volume is unknown but could be
      substantial for a production system with claims documents.
    mitigation: Measure current varbinary(max) storage volume. Plan blob extraction
      and Azure Blob migration as a pre-step before schema migration.

  - id: INSUREEDGE-2026-RSK-1-0004
    severity: MEDIUM
    probability: HIGH
    evidence: [EV-0-0224]
    title: Column name typos in production schema affect integration mapping
    description: >
      Policy.WrittingCompany, PolicyCommission.ComissionPercentage,
      AdditionalOrganisation.OraganisationType, IntermediaryContact.UpatedOn,
      NotifyLenderdock.PoilcyId are typos in the current production schema.
      Any integration code or reports that reference these column names must be
      mapped to corrected names in the target schema.
    mitigation: Maintain a typo-mapping table as part of the migration specification.
      Correct names in target schema; use column aliases in migration scripts.

  - id: INSUREEDGE-2026-RSK-1-0005
    severity: MEDIUM
    probability: HIGH
    evidence: [EV-0-0006]
    title: OutSystems NullDate sentinel (1900-01-01) must be handled in migration
    description: >
      OutSystems stores logical NULLs in datetime fields as convert(datetime, '1900-01-01').
      If migrated naively, the target system will have thousands of '1900-01-01' dates
      that must be converted to actual NULLs.
    mitigation: Include a transformation rule in migration scripts to convert
      '1900-01-01' datetime values to NULL for all datetime columns.

  - id: INSUREEDGE-2026-RSK-1-0006
    severity: MEDIUM
    probability: MEDIUM
    evidence: [EV-0-0224]
    title: HexCat_RunTime user has db_owner on InsureEdge_DEV — overprivileged
    description: >
      The external HexCat system runtime user holds db_owner rights on the operational
      database, granting it full DDL access. This is an excessive privilege that
      creates a security risk if the HexCat integration is compromised.
    mitigation: In target system, restrict HexCat_RunTime to EXECUTE on
      usp_UpdateHexCatRiskInfo and SELECT on relevant views only.

  - id: INSUREEDGE-2026-RSK-1-0007
    severity: MEDIUM
    probability: LOW
    evidence: [EV-0-0012]
    title: Plain-text default password 'Damco@12345' may exist in production User records
    description: >
      A batch function exists to re-encrypt users whose password field still contains
      the literal plain-text string 'Damco@12345'. If this function has not run for
      all users, plain-text passwords may be present in the database.
