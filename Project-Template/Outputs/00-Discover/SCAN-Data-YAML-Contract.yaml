findings:

  # --- DATABASE PLATFORM ---

  - id: INSUREEDGE-2026-FND-1-0001
    category: database_platform
    confidence: HIGH
    evidence: [EV-0-0224, EV-0-0225]
    statement: >
      InsureEdge runs on SQL Server 2022 (MSSQL16), compatibility level 150 (SQL Server 2019
      feature set), FULL recovery model, DATABASE_DEFAULT collation, QUERY_STORE enabled.
      Two databases: InsureEdge_DEV (operational, 92 tables) and InsureEdge_System_DEV
      (platform configuration, 26 tables).

  - id: INSUREEDGE-2026-FND-1-0002
    category: database_platform
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      InsureEdge_DEV has three explicitly created database users:
      outsystems_ie_db_sudhir (db_datareader), jitendrak@damcogroup.com
      (db_datareader + db_datawriter), and HexCat_RunTime (db_owner).
      HexCat_RunTime has unrestricted write access including DDL rights.

  - id: INSUREEDGE-2026-FND-1-0003
    category: database_platform
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      InsureEdge_DEV contains NO foreign key constraints declared in CREATE TABLE blocks.
      All FK constraints are added post-table via ALTER TABLE WITH CHECK ADD CONSTRAINT.
      37 FK constraints are present in total. The System_DEV database DOES declare FKs inline.

  - id: INSUREEDGE-2026-FND-1-0004
    category: database_platform
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      A user-defined table type HexCatRiskInfoType exists in InsureEdge_DEV with 27 columns,
      used exclusively by stored procedure usp_UpdateHexCatRiskInfo to receive batch risk
      data from the HexCat external catastrophe modelling system.

  # --- MULTI-TENANCY ---

  - id: INSUREEDGE-2026-FND-1-0005
    category: multi_tenancy
    confidence: HIGH
    evidence: [EV-0-0224, EV-0-0225, EV-0-0006, EV-0-0007]
    statement: >
      Multi-tenancy is implemented via a ClientId column present in every major operational
      entity in InsureEdge_DEV (Policy, Account, Claim, Intermediary, Adjuster, etc.) and
      in system entities in InsureEdge_System_DEV (User, Company, Product). ClientId is a
      bigint FK referencing InsureEdge_System_DEV.Client.Id. No row-level security (RLS)
      is enforced at the database layer; isolation relies entirely on application-layer
      WHERE ClientId = @ClientId filters.

  - id: INSUREEDGE-2026-FND-1-0006
    category: multi_tenancy
    confidence: HIGH
    evidence: [EV-0-0225]
    statement: >
      The master tenant record is stored in InsureEdge_System_DEV.Client table.
      ClientCode is a 5-digit zero-padded sequential integer auto-generated by the
      CreateOrUpdate_Clients application function (BR-COM-C01).

  # --- ENTITY ARCHITECTURE ---

  - id: INSUREEDGE-2026-FND-1-0007
    category: entity_architecture
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      Three 1:1 extension table pairs exist where the child's PK is an FK to the parent's PK:
      (1) Policy / Policy_Extended [PolicyId], (2) Account / Account_Extended [AccountId],
      (3) PolicyPaymentTransaction / PolicyPaymentTransaction_Extended [PolicyPaymentTransactionId].
      Policy_Extended also has a third tier: Policy_Extended_Binary (no PK constraint declared).

  - id: INSUREEDGE-2026-FND-1-0008
    category: entity_architecture
    confidence: HIGH
    evidence: [EV-0-0006]
    statement: >
      The OutSystems internal entity name for Policy is "Policy2". All application-layer
      logic references this alias. The physical SQL table is named "Policy".

  - id: INSUREEDGE-2026-FND-1-0009
    category: entity_architecture
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      CommonAddress is a single shared address entity for all modules. It carries nullable
      FK columns: AccountId, PolicyId, ClaimId, AdjusterId, PayeeId, BankingDetailId,
      WitnessId, ClaimantId. Exactly one of these is populated per record (polymorphic
      association). AddressType, Latitude, Longitude, and GoogleAddress are stored here.

  - id: INSUREEDGE-2026-FND-1-0010
    category: entity_architecture
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      AccountBinary is a multi-module binary document store with nullable FK columns for
      AccountId, ClaimId, PolicyId, AdjusterId, PayeeBankId, ReportId, LossExposureId,
      WitnessId, ClaimantId, BankDetailId, TaskId. BlobPath stores Azure Blob Storage
      path; DocumentType and DocumentName provide classification.

  - id: INSUREEDGE-2026-FND-1-0011
    category: entity_architecture
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      PolicyPremium has a UNIQUE constraint on PolicyId establishing a strict 1:1 with Policy.
      PolicyPaymentTransaction references PolicyPremiumId (not PolicyId directly), establishing
      a 3-level payment hierarchy: Policy → PolicyPremium → PolicyPaymentTransaction.

  - id: INSUREEDGE-2026-FND-1-0012
    category: entity_architecture
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      Self-referential FK: Account.Id references Account.Id (FK_Account_Account).
      ConfigurationValue.Id references ConfigurationValue.Id (FK_ConfigurationValues_ConfigurationValues1).
      Both are self-joins, likely representing parent-child or versioning patterns not
      further documented in the DDL.

  - id: INSUREEDGE-2026-FND-1-0013
    category: entity_architecture
    confidence: HIGH
    evidence: [EV-0-0225]
    statement: >
      InsureEdge_System_DEV.Product has a self-referential ParentId FK (product hierarchy).
      Module also has ParentModuleId FK to Module (module/submodule hierarchy).
      User has a ReportsTo FK to User.Id (management hierarchy — notable: FK references Id
      in the same User table via User.Id).

  - id: INSUREEDGE-2026-FND-1-0014
    category: entity_architecture
    confidence: HIGH
    evidence: [EV-0-0012]
    statement: >
      Four application-managed tables exist that are NOT in either DDL file:
      UserPasswordReset (password reset tokens), UserSystemNotifications (in-app notifications),
      OS_UserConfigurations (per-user UI preferences), and GridDefaultLayouts (per-user grid
      column layouts). These are OutSystems platform-generated tables managed by the ORM.

  # --- CROSS-DATABASE DEPENDENCIES ---

  - id: INSUREEDGE-2026-FND-1-0015
    category: cross_database
    confidence: HIGH
    evidence: [EV-0-0224, EV-0-0007, EV-0-0012]
    statement: >
      InsureEdge_DEV views (vw_HexCatInputRecords, vw_HexCatCompanyReference) and application
      queries cross-join to InsureEdge_System_DEV for Product, Client, Company, and User data.
      The cross-database name is resolved at runtime via site property IEDBName (function
      IESYSDBName in IE_Common_CS). This coupling means both databases must be co-located
      on the same SQL Server instance.

  - id: INSUREEDGE-2026-FND-1-0016
    category: cross_database
    confidence: HIGH
    evidence: [EV-0-0007, EV-0-0012]
    statement: >
      Two named OutSystems database connections are used: InsureEdge-LC (operational,
      InsureEdge_DEV) and InsureEdgeSYS-LC (system, InsureEdge_System_DEV). A third
      connection, DatabaseAccess.ForCurrentDatabase, accesses the OutSystems platform
      system database for [User] and Tenant tables.

  # --- HEXCAT INTEGRATION (DATA LAYER) ---

  - id: INSUREEDGE-2026-FND-1-0017
    category: integration_data
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      HexCat integration operates through stored procedure usp_UpdateHexCatRiskInfo which
      accepts a table-valued parameter (HexCatRiskInfoType, 27 columns). The SP atomically:
      (1) inserts a full copy of all input rows to HexCat_RiskInfo_Audit for audit,
      (2) updates PolicyRiskInformation with approved field values using non-null-win logic
      (existing non-null values are never overwritten by HexCat data),
      (3) updates Policy.WrittingCompany and Policy.LastStep=1.

  - id: INSUREEDGE-2026-FND-1-0018
    category: integration_data
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      HexCat flood elevation business rule: when HexCat returns FloodZone <> 'None' AND
      BuildingFloodElevation = NULL or empty, the system writes '-15' to
      PolicyRiskInformation.BuildingFloodElevation. This sentinel value indicates
      "HexCat flood zone confirmed but elevation data unavailable."

  # --- AUDIT PATTERNS ---

  - id: INSUREEDGE-2026-FND-1-0019
    category: audit_pattern
    confidence: HIGH
    evidence: [EV-0-0224, EV-0-0012]
    statement: >
      CreatedBy/UpdatedBy/CreatedOn/UpdatedOn columns appear on virtually every entity
      in both databases. The Audits table provides a secondary module-level audit trail
      with ActivityType, ActivityDescription, RecordId, Module, AuditBin (varbinary for
      binary audit payload), and TransactionId. AuditLogRecordRecent returns the 5 most
      recent records per user per module (BR-COM-A04).

  # --- SOFT DELETE ---

  - id: INSUREEDGE-2026-FND-1-0020
    category: data_pattern
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      Soft-delete is implemented on at least PolicyMortgage via IsDeleted (bit) column.
      StatusToggle (bit) + Status (nvarchar) pattern is used on Intermediary and Producer
      as an active/inactive toggle. No universal hard-delete constraint or trigger pattern
      was observed. Physical DELETE operations are used in commission disbursement and
      password reset contexts.

  # --- SENTINEL VALUES ---

  - id: INSUREEDGE-2026-FND-1-0021
    category: data_pattern
    confidence: HIGH
    evidence: [EV-0-0006]
    statement: >
      OutSystems uses convert(datetime, '1900-01-01') as a NullDate sentinel value for
      datetime fields that are logically null but stored as non-nullable datetime columns
      in the OutSystems ORM-managed tables. Target system must handle this sentinel during
      data migration.

  # --- SCHEMA QUALITY ISSUES ---

  - id: INSUREEDGE-2026-FND-1-0022
    category: schema_quality
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      Confirmed column name typos in production DDL:
      (1) Policy.WrittingCompany (should be WritingCompany — usp_UpdateHexCatRiskInfo
          corrects via R.WritingCompany at update time but stores to the misspelled column),
      (2) PolicyCommission.ComissionPercentage (missing 'm'),
      (3) Payee lacks a dedicated PK named Id in the summary context — actual PK is bigint IDENTITY,
      (4) AdditionalOrganisation.OraganisationType (transposed 'a' and 'r'),
      (5) IntermediaryContact.UpatedOn (missing 'd' in Updated),
      (6) IntermediaryProducerAddress.UpatedOn (same).

  - id: INSUREEDGE-2026-FND-1-0023
    category: schema_quality
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      Policy_Extended_Binary has no PRIMARY KEY constraint and no IDENTITY column.
      PolicyId column is nullable bigint. This table cannot enforce uniqueness or
      row-level integrity at the database layer.

  - id: INSUREEDGE-2026-FND-1-0024
    category: schema_quality
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      PolicyAccounts table (junction between Account and Policy) has no PRIMARY KEY
      and no UNIQUE constraint. Duplicate junction records cannot be prevented at the
      database layer.

  - id: INSUREEDGE-2026-FND-1-0025
    category: schema_quality
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      SampleTestForHexCat table exists in production database. Contains only Id, Count, CreateDate
      columns with a DEFAULT of getdate(). This appears to be a test/debug artifact retained
      in production.

  # --- STORAGE PATTERNS ---

  - id: INSUREEDGE-2026-FND-1-0026
    category: storage_pattern
    confidence: HIGH
    evidence: [EV-0-0224, EV-0-0012]
    statement: >
      Binary/document storage uses two strategies: (1) varbinary(max) inline storage
      (ClaimDocument.DocumentFile, TemplateDocument.DocumentFile, Note.Notes,
      Email.Message, BulkUploadAudit.ExcelFile, IntermediaryProducerLogo.Logo), and
      (2) Azure Blob Storage with path reference stored in BlobPath columns
      (AccountBinary.BlobPath, PolicyDocument.BlobPath). Both strategies coexist.
      Azure connection string and container name are stored in OutSystems site properties.

  # --- PASSWORD / AUTH ---

  - id: INSUREEDGE-2026-FND-1-0027
    category: security_data
    confidence: HIGH
    evidence: [EV-0-0012]
    statement: >
      Password reset tokens are stored in InsureEdge_System_DEV.UserPasswordReset table.
      Standard tokens expire in 30 minutes; client onboarding tokens expire in 24 hours.
      Rate limiting: a maximum of 2 active tokens per user in the 30-minute window before
      resend is blocked. On successful password reset the token is deleted. A batch utility
      (UpdateUsersPassword) exists to re-encrypt users whose Password field still contains
      the plain-text default 'Damco@12345'.

  # --- RATING TABLES ---

  - id: INSUREEDGE-2026-FND-1-0028
    category: entity_architecture
    confidence: HIGH
    evidence: [EV-0-0224]
    statement: >
      Four HBRater_ prefixed tables exist for homeowners rating:
      HBRater_ExcessFloodCoverage (flood zone/elevation rate data),
      HBRater_HRHexzones (hurricane/tornado/hail rates per hex zone),
      HBRater_LRHexzones (low-risk hex zones: derecho/wind/earthquake/sinkhole/liability/flood rates),
      HBRater_RatingWildfire (wildfire K8 factor per state),
      HBRater_StateTaxSheet (surplus lines, stamping fee, fire premium tax per state/abbreviation).
      These are lookup/reference tables not tied to ClientId — platform-wide rate tables.

